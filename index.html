<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SCALVS.ai — AI workforce</title>
  <meta name="description" content="SCALVS.ai by Infinitum: build agents that research, write, code, sell and operate for you.">
  <meta name="theme-color" content="#ffffff">
  <!-- UI follows /DESIGN.md: clean white, Helvetica Neue, text wordmarks with ™ -->
  <link rel="icon" href="public/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="src/styles.css">
  <!-- Fetch every module at once instead of one import level at a time: on slow or
       proxied connections the import chain otherwise leaves the page blank for seconds.
       tests/preload.test.js keeps this list in step with src/. -->
  <link rel="modulepreload" href="src/app.js">
  <link rel="modulepreload" href="src/store.js">
  <link rel="modulepreload" href="src/ui.js">
  <link rel="modulepreload" href="src/billing.js">
  <link rel="modulepreload" href="src/runner.js">
  <link rel="modulepreload" href="src/forecaster.js">
  <link rel="modulepreload" href="src/data.js">
  <link rel="modulepreload" href="src/exchange.js">
  <link rel="modulepreload" href="src/views/command.js">
  <link rel="modulepreload" href="src/views/studio.js">
  <link rel="modulepreload" href="src/views/connect.js">
  <link rel="modulepreload" href="src/views/earnings.js">
  <link rel="modulepreload" href="src/views/forecast.js">
  <link rel="stylesheet" href="src/i18n/i18n.css">
  <script type="module" src="src/i18n/start.js"></script>
<style id="cid-style">@media (max-width:860px){.cid-desk{display:none}}.cid-slot{display:inline-flex;align-items:center;margin-left:auto}.cid-fixed{position:fixed;top:12px;right:12px;z-index:1000;background:#fff;color:#111820;padding:4px}.cid-side{margin:0 0 10px;font-size:13px}.cid-side .cid-who{max-width:150px}@media (max-width:720px){.cid-slot .cid-who{display:none}}</style></head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <aside class="sidebar" aria-label="Primary">
    <a class="brand" href="#/command" aria-label="SCALVS.ai home">
      <span class="wordmark">SCALVS.ai<sup class="tm">™</sup></span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="#/command" class="nav-new" data-route="new">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        New task
      </a>
      <a href="#/studio" data-route="studio">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="8" r="3.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M5 20c1-4 4-6 7-6s6 2 7 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        Agents
      </a>
      <a href="#/forecast" data-route="forecast">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 18l5-6 4 3 7-9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Forecasts <span id="forecast-badge" class="dot-badge" hidden></span>
      </a>
      <a href="#/connect" data-route="connect">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9 7V3M15 7V3M7 7h10v4a5 5 0 0 1-10 0zM12 16v5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Connect
      </a>
      <a href="#/earnings" data-route="earnings">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 7h16v12H4zM4 11h16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        Earnings
      </a>
    </nav>
    <div class="recent" aria-label="Recent tasks">
      <div class="recent-head"><span>Recent</span><button type="button" id="clear-recent" class="tool" hidden>Clear finished</button></div>
      <ul id="recent-list" class="recent-list"></ul>
    </div>
    <div class="sidebar-foot">
      <a class="account" href="#/earnings">
        <span class="avatar" aria-hidden="true">IN</span>
        <span><span class="small">Infinitum</span><br><span class="muted tiny" id="plan-label">Free plan</span></span>
      </a>
    </div>
  </aside>
  <div id="scrim" class="scrim"></div>
  <!-- Cumulus://ID account bar: top right on desktop; on phones it sits in the top bar below. -->
  <div class="cid-fixed cid-desk" data-cumulus-bar></div>

  <div class="shell">
    <header class="topbar">
      <button id="menu-btn" class="icon-btn" aria-label="Open menu">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <a class="brand-sm" href="#/command" aria-label="SCALVS.ai home"><span class="wordmark">SCALVS.ai<sup class="tm">™</sup></span></a>
    <span class="cid-slot" data-cumulus-bar data-create="false"></span></header>
    <main id="main" tabindex="-1"><p class="muted" style="text-align:center;margin-top:30vh">Loading…</p></main>
  </div>

  <script type="module" src="src/app.js"></script>
  <!-- The Cumulus://ID account bar: a copy of https://id.cumuluscloud.app/id/bar.js, served from this
       mirror because Cloudflare is throttled in Russia. -->
  <script src="/public/cumulus-bar.js" data-client="scalvs" data-issuer="https://id.cumuluscloud.app" defer></script>
</body>
</html>
