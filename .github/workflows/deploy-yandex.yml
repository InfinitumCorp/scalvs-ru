name: deploy-yandex-ru

# Serves the Russia mirror from SCALVS's own Yandex Cloud server
# (scalvs-russia, ru-central1-a). One server per product: russia-web no longer
# serves this site. Visitors in Russia are redirected here from scalvs.app.
# Self-hosted runners in a public repo: never trigger on pull_request,
# so code from forks can't run on these servers.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-yandex-ru-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: deploy (scalvs-russia)
    runs-on: [self-hosted, yandex-ru, scalvs-russia]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Publish to nginx
        run: |
          rsync -a --delete --exclude '.git' --exclude '.github' ./ /var/www/scalvs-ru/

      - name: Check the site is served
        run: |
          # ru.scalvs.app redirects HTTP to HTTPS on scalvs-russia, so check the HTTPS vhost locally.
          code=$(curl -s -o /dev/null -w '%{http_code}' --resolve ru.scalvs.app:443:127.0.0.1 https://ru.scalvs.app/)
          echo "HTTP $code"
          test "$code" = 200
